name: app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # AR-02 - Flutter Architecture
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  supabase_flutter: ^2.8.0

  # DV-02 - selecao de imagem para o avatar (DV-02 SS11)
  image_picker: ^1.1.2

  # DV-07 - compartilhamento nativo de texto (sem Deep Links nesta versao)
  share_plus: ^10.1.4

  # RC-03A - Crash Reporting (captura global de erros, ver core/observability/)
  sentry_flutter: ^8.14.2

  # RC-03B - anotacoes @visibleForTesting nos hooks de teste do AppLogger
  # (ja era dependencia transitiva; declarada aqui para satisfazer o lint
  # depend_on_referenced_packages)
  meta: ^1.18.0
  posthog_flutter: ^5.33.0
  package_info_plus: ^9.0.1

  # RC-04E - locale explícito (pt_BR) para as strings padrão do próprio
  # Flutter (Material/Cupertino/Widgets). Pacote do SDK do Flutter, sem
  # custo de manutenção externo (mesmo status de `flutter_test`).
  flutter_localizations:
    sdk: flutter

  # IV-01 - renderizador SVG, decisão de arquitetura explicitamente
  # aprovada para consumir os ativos oficiais da marca (logos, símbolo e,
  # em rodada futura, ranking/expressões/decorativos) sem duplicar cada
  # um também em PNG. Pacote mantido pela publisher verificada flutter.dev.
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # QA-03 - Integration Testing (pacote oficial do SDK do Flutter,
  # nao uma dependencia de terceiros)
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # DV-01 - testes com repositorio mockado
  mocktail: ^1.0.4

  # RC-04D - geracao do icone/splash de release a partir de um asset-fonte
  # unico. Infraestrutura preparada, mas sem arte ainda: nao existe nenhum
  # logo BORAH em alta resolucao no repositorio (ver "flutter_icons"/
  # "flutter_native_splash" abaixo, que apontam para um caminho ainda
  # inexistente). Rodar apenas apos o asset ser fornecido - ver
  # RC-04D_RELEASE_READINESS.md.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # IV-01 (identidade visual oficial). Estrutura documentada em
  # assets/ASSETS.md. Reorganizado a partir da unica fonte de verdade
  # (BORAH_Pacote_Implementacao_Claude) - substitui a antiga pasta
  # assets/loading/ (mesmo arquivo de loading, agora sob assets/borah/).
  # Somente os arquivos realmente consumidos por um widget entram aqui
  # (mesma convencao da UI-03B): assets/borah/symbol/ e
  # assets/borah/app_icon/ existem no repositorio (fonte para
  # flutter_launcher_icons/flutter_native_splash, ferramentas que leem
  # direto do disco em tempo de build) mas nao sao declarados no bundle,
  # ja que nenhum widget os consome nesta rodada (ver IV-06/IV-07).
  # assets/icons/borah_location.png permanece intocado (fora de escopo).
  assets:
    - assets/borah/logos/
    - assets/borah/animations/borah_loading_transparent.webp
    - assets/icons/borah_location.png

  # UI-01 (Design System oficial, Manual da Marca BORAH v1.0/jul-2026):
  # Fredoka (titulos/chamadas) e Manrope (texto/interface/dados). Ambas sao
  # fontes variaveis (eixo wght) - o mesmo arquivo e declarado varias vezes,
  # uma por peso, tecnica padrao do Flutter para fontes variaveis (o shaper
  # seleciona a instancia correta pelo `weight`). Licenca SIL Open Font
  # License 1.1 (ver assets/fonts/*-OFL.txt).
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Variable.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 700

# IV-02 - matriz oficial do icone do app (BORAH_Pacote_Implementacao_Claude,
# fonte unica de verdade), substituindo o caminho provisorio da RC-04D.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/borah/app_icon/borah_app_icon_1024.png"
  min_sdk_android: 21

# IV-03 - splash nativo estatico e rapido (regra do material oficial),
# simbolo isolado sobre fundo branco - mesmo fundo ja usado pelo
# scaffoldBackgroundColor do Light Theme (AppTheme.light).
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/borah/symbol/borah_symbol_4096.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/borah/symbol/borah_symbol_4096.png"
